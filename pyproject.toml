[project]
name = "hapax-lsp"
version = "0.1.0"
description = "Language server for Squarp Hapax instrument definitions"
requires-python = ">=3.13"
dependencies = [
    "hapax-tui @ git+https://github.com/claytron/hapax-tui",
    "pygls>=2.1",
]

[project.scripts]
hapax-lsp = "hapax_lsp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
