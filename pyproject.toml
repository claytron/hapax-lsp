[project]
name = "hapax-lsp"
version = "0.1.0"
description = "Language server for Squarp Hapax instrument definitions"
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "hapax-tui>=0.1.1",
    "pygls>=2.1",
]

[project.scripts]
hapax-lsp = "hapax_lsp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
